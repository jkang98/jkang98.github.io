<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Monogram J K">
  <!-- Standalone copy of the monogram that index.html inlines. The inline copy follows the
       page's theme toggle; a file loaded through <img> can only follow the system scheme.
       The colours repeat the page tokens: light surface #F3F0EB and accent #2B4C78,
       dark surface #262320 and accent #8EB4E3. -->
  <style>
    .plate { fill: #F3F0EB; }
    .initials { fill: #2B4C78; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #262320; }
      .initials { fill: #8EB4E3; }
    }
  </style>
  <rect class="plate" width="320" height="400"/>
  <text class="initials" x="160" y="214" font-family="Newsreader, Georgia, 'Iowan Old Style', 'Times New Roman', Times, serif" font-size="112" font-weight="500" text-anchor="middle" dominant-baseline="middle">JK</text>
</svg>
