<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Browser-tab icon: the JK monogram as the outlines of Newsreader 500, the page's display
       face, so it looks the same on every system (an SVG icon cannot load web fonts). The colours
       repeat the page tokens: a plate in the accent colour with letters in the page background,
       for each theme (light: #2B4C78 on #FBFAF8; dark: #8EB4E3 on #1C1A17), so the tile reads on
       light and dark browser chrome alike. -->
  <style>
    .plate { fill: #2B4C78; }
    .initials { fill: #FBFAF8; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #8EB4E3; }
      .initials { fill: #1C1A17; }
    }
  </style>
