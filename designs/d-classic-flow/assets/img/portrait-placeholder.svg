<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Monogram J K">
  <!-- Standalone copy of the monogram that index.html inlines. The letters are the outlines of
       "JK" in Newsreader 500, the page's display face, so no font needs to load. The inline copy
       follows the page's theme toggle; a file loaded through <img> can only follow the system
       scheme. The colours repeat what the page tokens render to: the plate is --surface over the
       field's lilac ground (light #E5BFFA, dark #2D2D2D) and the letters are --accent (light
       #2C1F72, dark #D6C2FC). -->
  <style>
    .plate { fill: #E5BFFA; }
    .initials { fill: #2C1F72; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #2D2D2D; }
      .initials { fill: #D6C2FC; }
    }
  </style>
